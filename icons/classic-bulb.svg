<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="128" height="96" viewBox="0 0 128 96"
     role="img" aria-labelledby="title desc">
  <title id="title">Classic ambient light icon</title>
  <desc id="desc">A white stylized light bulb with a dark zigzag filament inside a rounded rectangular frame.</desc>

  <!-- Dark, slightly translucent rounded control frame -->
  <rect x="3.5" y="3.5" width="121" height="89"
        rx="8.5" ry="8.5"
        fill="#111015" fill-opacity="0.28"
        stroke="#111015" stroke-width="3.5"/>

  <!-- White bulb glass: wide dome tapering into the neck -->
  <path d="
    M64 10.5
    C49.5 10.5 38.2 14.2 31.8 22.2
    C25.7 29.8 29.5 39.7 35.8 47.2
    C39.2 51.2 42.4 55.3 44.1 61.6
    L83.9 61.6
    C85.7 55.3 88.8 51.2 92.2 47.2
    C98.5 39.7 102.3 29.8 96.2 22.2
    C89.8 14.2 78.5 10.5 64 10.5 Z"
    fill="#F2F1F4"/>

  <!-- Angular filament, matching the crown-like zigzag in the reference -->
  <path d="
    M40.2 31.1
    L52.2 39.5
    L64 32.2
    L75.8 39.5
    L87.8 31.1
    M40.2 31.1
    L49.1 51.2
    M87.8 31.1
    L78.9 51.2"
    fill="none" stroke="#17161A"
    stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Socket: three separated, slightly slanted white bands -->
  <path d="M43.6 63.7 L84.4 63.7 L82.6 69.6 L45.4 71.0 Z"
        fill="#F2F1F4"/>
  <path d="M45.0 73.3 L83.0 71.8 L82.6 79.3 L46.0 81.0 Z"
        fill="#F2F1F4"/>
  <path d="M49.2 83.7 L78.8 83.7 L77.8 88.8 L50.2 88.8 Z"
        fill="#F2F1F4"/>
</svg>
